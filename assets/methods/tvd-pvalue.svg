<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 335" width="960" height="335" role="img" aria-label="Schematic permutation distribution. Count permuted TVDs greater than or equal to observed TVD. The raw p value is (k+1)/(B+1). Atlas uses 99,999,999 permutations and myelin uses 9,999.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#46635f"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#122d2a;font-size:18px}.title{font-size:22px;font-weight:600}.small{font-size:16px;fill:#46635f}</style>
<rect width="960" height="335" fill="white"/><text x="20" y="30" class="title" text-anchor="start">Permutation p value</text><text x="20" y="59" class="small" text-anchor="start">Compare the observed TVD with the TVDs from shuffled labels.</text><rect x="65" y="238" width="16" height="12" fill="#c7cfcb"/><rect x="84" y="225" width="16" height="25" fill="#c7cfcb"/><rect x="103" y="207" width="16" height="43" fill="#c7cfcb"/><rect x="122" y="188" width="16" height="62" fill="#c7cfcb"/><rect x="141" y="164" width="16" height="86" fill="#c7cfcb"/><rect x="160" y="137" width="16" height="113" fill="#c7cfcb"/><rect x="179" y="111" width="16" height="139" fill="#c7cfcb"/><rect x="198" y="93" width="16" height="157" fill="#c7cfcb"/><rect x="217" y="85" width="16" height="165" fill="#c7cfcb"/><rect x="236" y="94" width="16" height="156" fill="#c7cfcb"/><rect x="255" y="106" width="16" height="144" fill="#c7cfcb"/><rect x="274" y="125" width="16" height="125" fill="#c7cfcb"/><rect x="293" y="150" width="16" height="100" fill="#c7cfcb"/><rect x="312" y="171" width="16" height="79" fill="#c7cfcb"/><rect x="331" y="190" width="16" height="60" fill="#c7cfcb"/><rect x="350" y="208" width="16" height="42" fill="#c7cfcb"/><rect x="369" y="222" width="16" height="28" fill="#c7cfcb"/><rect x="388" y="231" width="16" height="19" fill="#087f78"/><rect x="407" y="237" width="16" height="13" fill="#087f78"/><rect x="426" y="242" width="16" height="8" fill="#087f78"/><rect x="445" y="245" width="16" height="5" fill="#087f78"/><rect x="464" y="247" width="16" height="3" fill="#087f78"/><path d="M55 78V250H495" fill="none" stroke="#46635f" stroke-width="1.5"/><path d="M386 78V255" fill="none" stroke="#087f78" stroke-width="2" stroke-dasharray="5 4"/><text x="386" y="77" class="small" text-anchor="middle">Observed TVD</text><text x="275" y="279" class="small" text-anchor="middle">TVD</text><text transform="translate(24 165) rotate(-90)" class="small" text-anchor="middle">Permutations</text><text x="540" y="117" class="" text-anchor="start">k = permuted TVDs ≥ observed TVD</text><text x="540" y="151" class="" text-anchor="start">B = number of permutations</text><text x="540" y="199" class="title" text-anchor="start">p = (k + 1) / (B + 1)</text><text x="540" y="245" class="small" text-anchor="start">Atlas: B = 99,999,999</text><text x="540" y="273" class="small" text-anchor="start">Myelin: B = 9,999</text><text x="65" y="311" class="small" text-anchor="start">Schematic distribution; shaded bars contribute to k.</text></svg>
